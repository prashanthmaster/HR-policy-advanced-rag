name: V2 quality gate

on:
  pull_request:
  push:
    branches: [main, brownfield-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check src tests_v2 scripts/build_corpus_manifest.py scripts/build_ingestion_artifact.py

      - name: Check formatting
        run: uv run ruff format --check src tests_v2 scripts/build_corpus_manifest.py scripts/build_ingestion_artifact.py

      - name: Type check
        run: uv run pyright

      - name: Test with coverage
        run: uv run pytest --cov=hr_policy_rag --cov-report=term-missing tests_v2

      - name: Verify corpus manifest reproducibility
        run: uv run python scripts/build_corpus_manifest.py --check

      - name: Verify ingestion artifact reproducibility
        run: uv run python scripts/build_ingestion_artifact.py --check

      - name: Build package
        run: uv build

      - name: Build container
        run: docker build --tag hr-policy-rag:${{ github.sha }} .
